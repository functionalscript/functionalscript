# Development and CI tools; see doc/mise-trial/README.md.
# Keep these pins synchronized with fjs/ci/config/module.f.js.
min_version = "2026.10.19"

[tools]
node = "26.13.0"
"npm:typescript" = "7.0.2"
bun = "1.4.4"
rust = [
    { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-wasip1", "wasm32-wasip2", "wasm32-unknown-unknown", "wasm32-wasip1-threads", "i686-unknown-linux-gnu"], os = ["linux/x64"] },
    { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-wasip1", "wasm32-wasip2", "wasm32-unknown-unknown", "wasm32-wasip1-threads"], os = ["linux/arm64", "macos"] },
    { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["i686-pc-windows-msvc"], os = ["windows/x64"] },
    { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], os = ["windows/arm64"] },
]

[tools."github:denoland/deno"]
version = "2.9.8"

[tools."github:denoland/deno".platforms]
linux-x64 = { asset_pattern = "deno-x86_64-unknown-linux-gnu.zip" }
linux-arm64 = { asset_pattern = "deno-aarch64-unknown-linux-gnu.zip" }
macos-x64 = { asset_pattern = "deno-x86_64-apple-darwin.zip" }
macos-arm64 = { asset_pattern = "deno-aarch64-apple-darwin.zip" }
windows-x64 = { asset_pattern = "deno-x86_64-pc-windows-msvc.zip" }
windows-arm64 = { asset_pattern = "deno-aarch64-pc-windows-msvc.zip" }

[tools."github:bytecodealliance/wasmtime"]
version = "50.0.0"

[tools."github:bytecodealliance/wasmtime".platforms]
linux-x64 = { asset_pattern = "wasmtime-v50.0.0-x86_64-linux.tar.xz" }
linux-arm64 = { asset_pattern = "wasmtime-v50.0.0-aarch64-linux.tar.xz" }
macos-x64 = { asset_pattern = "wasmtime-v50.0.0-x86_64-macos.tar.xz" }
macos-arm64 = { asset_pattern = "wasmtime-v50.0.0-aarch64-macos.tar.xz" }
windows-x64 = { asset_pattern = "wasmtime-v50.0.0-x86_64-windows.zip" }
windows-arm64 = { asset_pattern = "wasmtime-v50.0.0-aarch64-windows.zip" }

[tools."github:wasmerio/wasmer"]
version = "7.5.0"
# Upstream has no native Windows ARM64 archive, and none for macOS x64 since
# 7.2.0; no emulated substitution. CI runs Wasmer on ARM Linux only.
os = ["linux", "macos/arm64", "windows/x64"]

[tools."github:wasmerio/wasmer".platforms]
linux-x64 = { asset_pattern = "wasmer-linux-amd64.tar.gz" }
linux-arm64 = { asset_pattern = "wasmer-linux-aarch64.tar.gz" }
macos-arm64 = { asset_pattern = "wasmer-darwin-arm64.tar.gz" }
windows-x64 = { asset_pattern = "wasmer-windows-amd64.tar.gz" }

[tasks.check]
description = "Show the selected baseline tool versions"
run = ["node --version", "tsc --version", "rustc --version", "cargo --version", "deno --version", "bun --version", "wasmtime --version"]

[tasks.test]
run = "npm test"

[tasks.rust-test]
run = "cargo test"

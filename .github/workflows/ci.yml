{
  "name": "CI",
  "on": {
    "pull_request": {},
    "merge_group": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "ubuntu-intel": {
      "runs-on": "ubuntu-26.04",
      "steps": [
        {
          "run": "sudo apt-get update && sudo apt-get install -y libc6-dev-i386"
        },
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "i686-unknown-linux-gnu"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "cargo test --target i686-unknown-linux-gnu"
        },
        {
          "run": "cargo test --target i686-unknown-linux-gnu --release"
        },
        {
          "run": "cargo clippy --target i686-unknown-linux-gnu -- -D warnings"
        },
        {
          "run": "cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "ubuntu-arm": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "macos-intel": {
      "runs-on": "macos-26-intel",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "macos-arm": {
      "runs-on": "macos-26",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "windows-intel": {
      "runs-on": "windows-2025",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "i686-pc-windows-msvc"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "cargo test --target i686-pc-windows-msvc"
        },
        {
          "run": "cargo test --target i686-pc-windows-msvc --release"
        },
        {
          "run": "cargo clippy --target i686-pc-windows-msvc -- -D warnings"
        },
        {
          "run": "cargo clippy --target i686-pc-windows-msvc --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "windows-arm": {
      "runs-on": "windows-11-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs test"
        }
      ]
    },
    "wasm": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.98.0",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown,wasm32-wasip1-threads"
          }
        },
        {
          "uses": "bytecodealliance/actions/wasmtime/setup@v1.1.3",
          "with": {
            "version": "48.0.1"
          }
        },
        {
          "uses": "wasmerio/setup-wasmer@v3.1",
          "with": {
            "version": "v7.3.0"
          }
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo fmt -- --check"
        },
        {
          "run": "cargo test --target wasm32-wasip1"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1 -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1 --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo test --target wasm32-wasip2"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip2 -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip2 --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --release"
        },
        {
          "run": "cargo clippy --target wasm32-unknown-unknown -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-unknown-unknown --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1-threads -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1-threads --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml --release"
        }
      ]
    },
    "deno": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "denoland/setup-deno@v2.0.5",
          "with": {
            "deno-version": "2.9.6"
          }
        },
        {
          "run": "deno install -g -A --minimum-dependency-age=0 npm:functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "deno run -A --minimum-dependency-age=0 npm:functionalscript@0.47.0 test"
        },
        {
          "run": "deno install --frozen"
        },
        {
          "run": "deno task cov"
        }
      ]
    },
    "bun": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "oven-sh/setup-bun@v2.2.0",
          "with": {
            "bun-version": "1.4.0"
          }
        },
        {
          "run": "bun install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "run": "bunx functionalscript@0.47.0 test"
        },
        {
          "run": "bun test --coverage"
        }
      ]
    },
    "node22": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "22.23.2"
          }
        },
        {
          "run": "npm install -g functionalscript@0.47.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "test \"$(node --version)\" = v22.23.2"
        },
        {
          "run": "fjs test"
        },
        {
          "run": "node --test"
        }
      ]
    },
    "node24": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "cachix/install-nix-action@v31.11.1"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "test \"$(nix develop ./nix/node24 --command node --version)\" = v24.19.0"
        },
        {
          "run": "nix develop ./nix/node24 --command npm ci"
        },
        {
          "run": "nix develop ./nix/node24 --command node --test"
        }
      ]
    },
    "node26": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "test \"$(node --version)\" = v26.7.0"
        },
        {
          "run": "npm run ci-update"
        },
        {
          "run": "git add -A && git diff --cached --exit-code"
        },
        {
          "run": "! grep -rnE '^(/\\*\\*.*@typedef|\\s\\* *@typedef)' --include='*.mjs' --exclude-dir=node_modules ."
        },
        {
          "run": "npx tsc"
        },
        {
          "run": "npm run cov"
        },
        {
          "run": "npm pack"
        },
        {
          "uses": "actions/upload-artifact@v7.0.1",
          "with": {
            "name": "package-tarball",
            "path": "*.tgz",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "package-check": {
      "runs-on": "ubuntu-26.04-arm",
      "needs": [
        "node26"
      ],
      "steps": [
        {
          "uses": "actions/download-artifact@v8.0.1",
          "with": {
            "name": "package-tarball"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.7.0"
          }
        },
        {
          "run": "npm init -y > /dev/null"
        },
        {
          "run": "npm install \"packed@file:$(echo *.tgz)\""
        },
        {
          "run": "npm install \"typescript@=7.0.2\""
        },
        {
          "run": "echo '{\"include\":[\"node_modules/packed/**/*\",\"node_modules/packed/**/.*\",\"node_modules/packed/**/.*/**/*\"],\"exclude\":[],\"compilerOptions\":{\"module\":\"nodenext\",\"target\":\"esnext\",\"strict\":true,\"noEmit\":true,\"skipLibCheck\":false}}' > tsconfig.json"
        },
        {
          "run": "npx tsc"
        }
      ]
    }
  }
}
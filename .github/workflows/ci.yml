{
  "name": "CI",
  "on": {
    "pull_request": {},
    "merge_group": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "ubuntu-intel": {
      "runs-on": "ubuntu-26.04",
      "steps": [
        {
          "run": "sudo apt-get update && sudo apt-get install -y libc6-dev-i386"
        },
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "i686-unknown-linux-gnu"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "cargo test --target i686-unknown-linux-gnu"
        },
        {
          "run": "cargo test --target i686-unknown-linux-gnu --release"
        },
        {
          "run": "cargo clippy --target i686-unknown-linux-gnu -- -D warnings"
        },
        {
          "run": "cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "ubuntu-arm": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "macos-intel": {
      "runs-on": "macos-26-intel",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "macos-arm": {
      "runs-on": "macos-26",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "windows-intel": {
      "runs-on": "windows-2025",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "i686-pc-windows-msvc"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "cargo test --target i686-pc-windows-msvc"
        },
        {
          "run": "cargo test --target i686-pc-windows-msvc --release"
        },
        {
          "run": "cargo clippy --target i686-pc-windows-msvc -- -D warnings"
        },
        {
          "run": "cargo clippy --target i686-pc-windows-msvc --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "windows-arm": {
      "runs-on": "windows-11-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy"
          }
        },
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo test"
        },
        {
          "run": "cargo test --release"
        },
        {
          "run": "cargo clippy -- -D warnings"
        },
        {
          "run": "cargo clippy --release -- -D warnings"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "wasm": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "dtolnay/rust-toolchain@1.97.1",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown,wasm32-wasip1-threads"
          }
        },
        {
          "uses": "bytecodealliance/actions/wasmtime/setup@v1.1.3",
          "with": {
            "version": "47.0.2"
          }
        },
        {
          "uses": "wasmerio/setup-wasmer@v3.1",
          "with": {
            "version": "v7.2.1"
          }
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "cargo fmt -- --check"
        },
        {
          "run": "cargo test --target wasm32-wasip1"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1 -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1 --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo test --target wasm32-wasip2"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip2 -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip2 --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --release"
        },
        {
          "run": "cargo clippy --target wasm32-unknown-unknown -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-unknown-unknown --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml --release"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1-threads -- -D warnings"
        },
        {
          "run": "cargo clippy --target wasm32-wasip1-threads --release -- -D warnings"
        },
        {
          "run": "cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml"
        },
        {
          "run": "cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml --release"
        }
      ]
    },
    "deno": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "denoland/setup-deno@v2.0.5",
          "with": {
            "deno-version": "2.9.4"
          }
        },
        {
          "run": "deno install -g -A --minimum-dependency-age=0 npm:functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "deno run -A --minimum-dependency-age=0 npm:functionalscript@0.38.0 t"
        },
        {
          "run": "deno install --frozen"
        },
        {
          "run": "deno test --allow-read --allow-env --allow-sys --coverage && deno coverage --include='.*module\\.f\\.ts'"
        }
      ]
    },
    "bun": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "oven-sh/setup-bun@v2.2.0",
          "with": {
            "bun-version": "1.3.14"
          }
        },
        {
          "run": "bun install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "run": "bunx functionalscript@0.38.0 t"
        },
        {
          "run": "bun test --coverage"
        }
      ]
    },
    "node22": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "22.23.1"
          }
        },
        {
          "run": "npm install -g functionalscript@0.38.0"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "fjs t"
        }
      ]
    },
    "node24": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "24.18.0"
          }
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "node --test"
        }
      ]
    },
    "node26": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run ci-update"
        },
        {
          "run": "git add -A && git diff --cached --exit-code"
        },
        {
          "run": "npx tsc"
        },
        {
          "run": "npm run cov"
        },
        {
          "run": "npm pack"
        }
      ]
    },
    "playwright": {
      "runs-on": "ubuntu-26.04-arm",
      "steps": [
        {
          "uses": "actions/setup-node@v7.0.0",
          "with": {
            "node-version": "26.5.0"
          }
        },
        {
          "uses": "actions/cache@v6.1.0",
          "with": {
            "path": "~/.cache/ms-playwright",
            "key": "ubuntu-26.04-arm-playwright-1.62.0"
          }
        },
        {
          "run": "npm install -g playwright@1.62.0"
        },
        {
          "run": "playwright install-deps"
        },
        {
          "run": "playwright install"
        },
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npx playwright test --browser=chromium"
        },
        {
          "run": "npx playwright test --browser=firefox"
        },
        {
          "run": "npx playwright test --browser=webkit"
        }
      ]
    },
    "docker-intel": {
      "runs-on": "ubuntu-26.04",
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "echo \"$GITHUB_TOKEN\" | docker login ghcr.io -u \"$GITHUB_ACTOR\" --password-stdin",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "run": "image=\"ghcr.io/${GITHUB_REPOSITORY,,}/ci\"\ntag=\"$(sha256sum docker/Dockerfile | cut -d' ' -f1)-$(dpkg --print-architecture)\"\nref=\"$image:$tag\"\necho \"image: $ref\"\nif docker manifest inspect \"$ref\" > /dev/null 2>&1; then\n  docker pull \"$ref\" && docker tag \"$ref\" functionalscript\nelse\n  docker build -t functionalscript -t \"$ref\" ./docker\nfi"
        },
        {
          "run": "docker run --rm functionalscript bash -c \"node --version && npm --version && deno --version && bun --version && rustc --version && cargo --version && wasmtime --version && wasmer --version && playwright --version && fjs help\""
        },
        {
          "run": "image=\"ghcr.io/${GITHUB_REPOSITORY,,}/ci\"\ntag=\"$(sha256sum docker/Dockerfile | cut -d' ' -f1)-$(dpkg --print-architecture)\"\nref=\"$image:$tag\"\ndocker push \"$ref\"",
          "if": "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
        }
      ]
    },
    "docker-arm": {
      "runs-on": "ubuntu-26.04-arm",
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "run": "echo \"$GITHUB_TOKEN\" | docker login ghcr.io -u \"$GITHUB_ACTOR\" --password-stdin",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "run": "image=\"ghcr.io/${GITHUB_REPOSITORY,,}/ci\"\ntag=\"$(sha256sum docker/Dockerfile | cut -d' ' -f1)-$(dpkg --print-architecture)\"\nref=\"$image:$tag\"\necho \"image: $ref\"\nif docker manifest inspect \"$ref\" > /dev/null 2>&1; then\n  docker pull \"$ref\" && docker tag \"$ref\" functionalscript\nelse\n  docker build -t functionalscript -t \"$ref\" ./docker\nfi"
        },
        {
          "run": "docker run --rm functionalscript bash -c \"node --version && npm --version && deno --version && bun --version && rustc --version && cargo --version && wasmtime --version && wasmer --version && playwright --version && fjs help\""
        },
        {
          "run": "image=\"ghcr.io/${GITHUB_REPOSITORY,,}/ci\"\ntag=\"$(sha256sum docker/Dockerfile | cut -d' ' -f1)-$(dpkg --print-architecture)\"\nref=\"$image:$tag\"\ndocker push \"$ref\"",
          "if": "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
        }
      ]
    }
  }
}
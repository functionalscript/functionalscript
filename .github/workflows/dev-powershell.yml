name: PowerShell development environment
on:
  pull_request:
    paths:
      - 'dev.ps1'
      - '.github/workflows/dev-powershell.yml'
      - 'mise.toml'
      - 'mise.lock'
      - '.mise/locks/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v3
        with:
          version: '2026.10.19'
          install_args: '--locked'
          env: false
          add_shims_to_path: false
      - name: Verify command, exit status and interactive shell
        shell: python
        env:
          TEST_POWERSHELL: ${{ matrix.shell }}
        run: |
          import os
          import subprocess

          shell = os.environ['TEST_POWERSHELL']
          wrapper = [shell, '-NoProfile', '-File', './dev.ps1']

          def run(args, stdin=None):
              result = subprocess.run(
                  wrapper + args, input=stdin, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=60,
              )
              print(result.stdout, flush=True)
              return result

          version = run(['node', '--version'])
          assert version.returncode == 0, version.returncode
          assert version.stdout.strip() == 'v26.12.1', version.stdout

          failure = run(['node', '-e', 'process.exit(23)'])
          assert failure.returncode == 23, failure.returncode

          interactive = run([], stdin=(
              "node -e \"console.log('DEV_PS1_NODE=' + process.version)\"\n"
              "Write-Output ('DEV_PS1_EDITION=' + $PSVersionTable.PSEdition)\n"
              "Write-Output ('DEV_PS1_PROMPT=' + (prompt))\n"
              "exit 0\n"
          ))
          assert interactive.returncode == 0, interactive.returncode
          assert 'DEV_PS1_NODE=v26.12.1' in interactive.stdout, interactive.stdout
          assert 'DEV_PS1_PROMPT=FJS ' in interactive.stdout, interactive.stdout
          edition = 'Core' if shell == 'pwsh' else 'Desktop'
          assert 'DEV_PS1_EDITION=' + edition in interactive.stdout, interactive.stdout

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'{shell}: command execution, exit code 23, and interactive '
                            f'startup with the mise Node version passed.\n')

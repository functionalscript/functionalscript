{
  "name": "CI",
  "on": {
    "pull_request": {},
    "merge_group": {}
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "ubuntu-intel": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1",
          "with": {
            "fetch-depth": "1"
          }
        },
        {
          "uses": "actions/setup-node@v7.1.0",
          "with": {
            "package-manager-cache": "false",
            "node-version": "26.12.1"
          }
        },
        {
          "run": "git fetch --depth 1 origin build-cache:build-cache build-cache:refs/remotes/origin/build-cache",
          "continue-on-error": true
        },
        {
          "id": "init",
          "run": "npm start ci init",
          "continue-on-error": true,
          "env": {
            "FJS_CI_CHECKS": "[{\"id\":\"rust\",\"rung\":\"rust\",\"steps\":[{\"uses\":\"dtolnay/rust-toolchain@1.99.1\",\"with\":{\"components\":\"rustfmt,clippy\",\"targets\":\"i686-unknown-linux-gnu\"}},{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target i686-unknown-linux-gnu\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target i686-unknown-linux-gnu --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target i686-unknown-linux-gnu -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings\",\"shell\":\"bash\"}]},{\"id\":\"suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci npm ci\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci node --test\",\"shell\":\"bash\"}]}]",
            "FJS_CI_PLATFORM": "{\"os\":\"ubuntu\",\"version\":\"26.04\",\"architecture\":\"x64\"}"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@1.99.1",
          "with": {
            "components": "rustfmt,clippy",
            "targets": "i686-unknown-linux-gnu"
          },
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "uses": "prefix-dev/setup-pixi@v0.11.2",
          "with": {
            "pixi-version": "v0.83.0",
            "environments": "ci",
            "locked": "true",
            "cache": "true"
          },
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "test \"$(pixi run --locked --environment ci node --version)\" = \"v26.12.1\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci npm ci",
          "shell": "bash",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo test",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo test --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo clippy -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo clippy --release -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo test --target i686-unknown-linux-gnu",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo test --target i686-unknown-linux-gnu --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo clippy --target i686-unknown-linux-gnu -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "pixi run --locked --environment ci cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "npm start ci report rust",
          "if": "steps.init.outputs.hit-rust != 'true'",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        },
        {
          "run": "pixi run --locked --environment ci node --test",
          "shell": "bash",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "npm start ci report suite",
          "if": "steps.init.outputs.hit-suite != 'true'",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        },
        {
          "run": "npm start ci publish",
          "if": "always() && steps.init.outcome == 'success' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com",
            "GIT_COMMITTER_NAME": "github-actions[bot]",
            "GIT_COMMITTER_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        }
      ],
      "permissions": {
        "contents": "write"
      }
    },

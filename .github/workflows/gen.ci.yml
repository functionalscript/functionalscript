{
  "name": "CI",
  "on": {
    "pull_request": {},
    "merge_group": {},
    "push": {
      "branches": [
        "**"
      ]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "ubuntu-intel": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1",
          "with": {
            "fetch-depth": "1"
          }
        },
        {
          "uses": "actions/setup-node@v7.1.0",
          "with": {
            "package-manager-cache": "false",
            "node-version": "26.12.1"
          }
        },
        {
          "run": "git fetch --depth 1 origin build-cache:build-cache build-cache:refs/remotes/origin/build-cache",
          "continue-on-error": true
        },
        {
          "id": "init",
          "run": "npm start ci init",
          "continue-on-error": true,
          "env": {
            "FJS_CI_CHECKS": "[{\"id\":\"rust\",\"rung\":\"rust\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"test \\\"\\u0024(mise exec -- rustc --version | cut -d' ' -f1,2)\\\" = \\\"rustc 1.99.1\\\"\",\"shell\":\"bash\"},{\"run\":\"sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target i686-unknown-linux-gnu\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target i686-unknown-linux-gnu --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target i686-unknown-linux-gnu -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings\",\"shell\":\"bash\"}]},{\"id\":\"suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"mise exec -- npm ci\",\"shell\":\"bash\"},{\"run\":\"mise exec -- node --test ./fjs/emergent_testing/js-only.mjs\",\"shell\":\"bash\"}]}]",
            "FJS_CI_PLATFORM": "{\"os\":\"ubuntu\",\"version\":\"26.04\",\"architecture\":\"x64\"}"
          }
        },
        {
          "uses": "jdx/mise-action@v5",
          "with": {
            "version": "2026.10.19",
            "install_args": "--locked",
            "cache": "true",
            "cache_max_age_days": "0",
            "env": "false",
            "add_shims_to_path": "false"
          },
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "test \"$(mise exec -- rustc --version | cut -d' ' -f1,2)\" = \"rustc 1.99.1\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "test \"$(mise exec -- node --version)\" = \"v26.12.1\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "mise exec -- npm ci",
          "shell": "bash",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "mise exec -- cargo test",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --release -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --target i686-unknown-linux-gnu",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --target i686-unknown-linux-gnu --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --target i686-unknown-linux-gnu -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "npm start ci report rust",
          "if": "steps.init.outputs.hit-rust != 'true'",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        },
        {
          "run": "mise exec -- node --test ./fjs/emergent_testing/js-only.mjs",
          "shell": "bash",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "npm start ci report suite",
          "if": "steps.init.outputs.hit-suite != 'true'",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        },
        {
          "run": "npm start ci publish",
          "if": "always() && steps.init.outcome == 'success' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)",
          "env": {
            "GIT_AUTHOR_NAME": "github-actions[bot]",
            "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com",
            "GIT_COMMITTER_NAME": "github-actions[bot]",
            "GIT_COMMITTER_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com"
          },
          "continue-on-error": true
        }
      ],
      "permissions": {
        "contents": "write"
      }
    },
    "ubuntu-arm": {
      "runs-on": "ubuntu-26.04-arm",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1",
          "with": {
            "fetch-depth": "1"
          }
        },
        {
          "uses": "actions/setup-node@v7.1.0",
          "with": {
            "package-manager-cache": "false",
            "node-version": "26.12.1"
          }
        },
        {
          "run": "git fetch --depth 1 origin build-cache:build-cache build-cache:refs/remotes/origin/build-cache",
          "continue-on-error": true
        },
        {
          "id": "init",
          "run": "npm start ci init",
          "continue-on-error": true,
          "env": {
            "FJS_CI_CHECKS": "[{\"id\":\"rust\",\"rung\":\"rust\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"test \\\"\\u0024(mise exec -- rustc --version | cut -d' ' -f1,2)\\\" = \\\"rustc 1.99.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- wasmtime --version | cut -d' ' -f1,2)\\\" = \\\"wasmtime 50.0.0\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- wasmer --version)\\\" = \\\"wasmer 7.5.0\\\"\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo fmt -- --check\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1 --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip1 -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip1 --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip2\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip2 --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip2 -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip2 --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-unknown-unknown\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-unknown-unknown --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-unknown-unknown -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-unknown-unknown --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip1-threads -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo clippy --target wasm32-wasip1-threads --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"mise exec -- cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"}]},{\"id\":\"suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"mise exec -- npm ci\",\"shell\":\"bash\"},{\"run\":\"mise exec -- node --test ./fjs/emergent_testing/js-only.mjs\",\"shell\":\"bash\"}]},{\"id\":\"spidermonkey-compile\",\"rung\":\"fjs\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"mise -E spidermonkey lock http:spidermonkey --platform linux-arm64\",\"shell\":\"bash\"},{\"run\":\"mise -E spidermonkey install --locked http:spidermonkey\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise -E spidermonkey exec -- js --version)\\\" = \\\"JavaScript-C153.6.0\\\"\",\"shell\":\"bash\"},{\"run\":\"mise -E spidermonkey exec -- npm run sm c\",\"shell\":\"bash\"}]},{\"id\":\"spidermonkey-suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"jdx/mise-action@v5\",\"with\":{\"version\":\"2026.10.19\",\"install_args\":\"--locked\",\"cache\":\"true\",\"cache_max_age_days\":\"0\",\"env\":\"false\",\"add_shims_to_path\":\"false\"}},{\"run\":\"mise -E spidermonkey lock http:spidermonkey --platform linux-arm64\",\"shell\":\"bash\"},{\"run\":\"mise -E spidermonkey install --locked http:spidermonkey\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise exec -- node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(mise -E spidermonkey exec -- js --version)\\\" = \\\"JavaScript-C153.6.0\\\"\",\"shell\":\"bash\"},{\"run\":\"mise -E spidermonkey exec -- npm run sm t\",\"shell\":\"bash\"}]}]",
            "FJS_CI_PLATFORM": "{\"os\":\"ubuntu\",\"version\":\"26.04\",\"architecture\":\"arm64\"}"
          }
        },
        {
          "uses": "jdx/mise-action@v5",
          "with": {
            "version": "2026.10.19",
            "install_args": "--locked",
            "cache": "true",
            "cache_max_age_days": "0",
            "env": "false",
            "add_shims_to_path": "false"
          },
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true' || steps.init.outputs.hit-spidermonkey-compile != 'true' || steps.init.outputs.hit-spidermonkey-suite != 'true'"
        },
        {
          "run": "test \"$(mise exec -- rustc --version | cut -d' ' -f1,2)\" = \"rustc 1.99.1\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise -E spidermonkey lock http:spidermonkey --platform linux-arm64",
          "shell": "bash",
          "if": "steps.init.outputs.hit-spidermonkey-compile != 'true' || steps.init.outputs.hit-spidermonkey-suite != 'true'"
        },
        {
          "run": "mise -E spidermonkey install --locked http:spidermonkey",
          "shell": "bash",
          "if": "steps.init.outputs.hit-spidermonkey-compile != 'true' || steps.init.outputs.hit-spidermonkey-suite != 'true'"
        },
        {
          "run": "test \"$(mise exec -- node --version)\" = \"v26.12.1\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true' || steps.init.outputs.hit-suite != 'true' || steps.init.outputs.hit-spidermonkey-compile != 'true' || steps.init.outputs.hit-spidermonkey-suite != 'true'"
        },
        {
          "run": "test \"$(mise exec -- wasmtime --version | cut -d' ' -f1,2)\" = \"wasmtime 50.0.0\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "test \"$(mise exec -- wasmer --version)\" = \"wasmer 7.5.0\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "test \"$(mise -E spidermonkey exec -- js --version)\" = \"JavaScript-C153.6.0\"",
          "shell": "bash",
          "if": "steps.init.outputs.hit-spidermonkey-compile != 'true' || steps.init.outputs.hit-spidermonkey-suite != 'true'"
        },
        {
          "run": "mise exec -- npm ci",
          "shell": "bash",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "mise exec -- cargo fmt -- --check",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --release -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --target wasm32-wasip1",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo test --target wasm32-wasip1 --release",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --target wasm32-wasip1 -- -D warnings",
          "shell": "bash",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "mise exec -- cargo clippy --target wasm32-wasip1 --release -- -D warnings",

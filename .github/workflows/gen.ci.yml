          "continue-on-error": true,
          "env": {
            "FJS_CI_CHECKS": "[{\"id\":\"rust\",\"rung\":\"rust\",\"steps\":[{\"uses\":\"dtolnay/rust-toolchain@1.99.1\",\"with\":{\"components\":\"rustfmt,clippy\",\"targets\":\"wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown,wasm32-wasip1-threads\"}},{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"pixi run --locked --environment ci sh fjs/ci/pixi/install-supplements.sh wasmtime 45.0.2\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci wasmtime --version | cut -d ' ' -f 1-2)\\\" = \\\"wasmtime 45.0.2\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci wasmer --version)\\\" = \\\"wasmer 7.5.0\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo fmt -- --check\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1 --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip1 -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip1 --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1 --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip2\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip2 --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip2 -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip2 --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip2 --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-unknown-unknown\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-unknown-unknown --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-unknown-unknown -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-unknown-unknown --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-unknown-unknown --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip1-threads -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo clippy --target wasm32-wasip1-threads --release -- -D warnings\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci cargo test --target wasm32-wasip1-threads --config .cargo/config.wasmer.toml --release\",\"shell\":\"bash\"}]},{\"id\":\"suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci npm ci\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci node --test\",\"shell\":\"bash\"}]},{\"id\":\"spidermonkey-compile\",\"rung\":\"fjs\",\"steps\":[{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"pixi run --locked --environment ci sh fjs/ci/pixi/install-supplements.sh spidermonkey 140.14.0\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci js --version)\\\" = \\\"JavaScript-C140.14.0\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci npm run sm c\",\"shell\":\"bash\"}]},{\"id\":\"spidermonkey-suite\",\"rung\":\"js\",\"steps\":[{\"uses\":\"prefix-dev/setup-pixi@v0.11.2\",\"with\":{\"pixi-version\":\"v0.83.0\",\"environments\":\"ci\",\"locked\":\"true\",\"cache\":\"true\"}},{\"run\":\"pixi run --locked --environment ci sh fjs/ci/pixi/install-supplements.sh spidermonkey 140.14.0\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci node --version)\\\" = \\\"v26.12.1\\\"\",\"shell\":\"bash\"},{\"run\":\"test \\\"\\u0024(pixi run --locked --environment ci js --version)\\\" = \\\"JavaScript-C140.14.0\\\"\",\"shell\":\"bash\"},{\"run\":\"pixi run --locked --environment ci npm run sm t\",\"shell\":\"bash\"}]}]",
            "FJS_CI_PLATFORM": "{\"os\":\"ubuntu\",\"version\":\"26.04\",\"architecture\":\"arm64\"}"
          }
        },
        {

            "FJS_CI_PLATFORM": "{\"os\":\"ubuntu\",\"version\":\"26.04\",\"architecture\":\"x64\"}"
          }
        },
        {
          "uses": "cachix/install-nix-action@v31.11.2"
        },
        {
          "run": "test \"$(sh ./gen.nix/run node --version)\" = \"v26.12.1\""
        },
        {
          "run": "sh ./gen.nix/run npm ci",
          "if": "steps.init.outputs.hit-suite != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo test",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo test --release",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo clippy -- -D warnings",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo clippy --release -- -D warnings",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo test --target i686-unknown-linux-gnu",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo test --target i686-unknown-linux-gnu --release",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo clippy --target i686-unknown-linux-gnu -- -D warnings",
          "if": "steps.init.outputs.hit-rust != 'true'"
        },
        {
          "run": "sh ./gen.nix/run cargo clippy --target i686-unknown-linux-gnu --release -- -D warnings",

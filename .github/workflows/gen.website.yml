{
  "name": "Website",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.event_name != 'push' }}"
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "website": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "pull-requests": "write"
      },
      "env": {
        "MISE_DATA_DIR": "${{ github.workspace }}-mise",
        "MISE_RUSTUP_HOME": "${{ github.workspace }}-mise/rustup",
        "MISE_CARGO_HOME": "${{ github.workspace }}-mise/cargo"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1"
        },
        {
          "uses": "jdx/mise-action@v5",
          "with": {
            "version": "2026.10.19",
            "install_args": "--locked",
            "cache": "true",
            "cache_key_prefix": "mise-rust-v1",
            "cache_max_age_days": "0",
            "env": "false",
            "add_shims_to_path": "false"
          },
          "env": {
            "TEMP": "${{ runner.temp }}",
            "TMP": "${{ runner.temp }}"
          }
        },
        {
          "run": "mise exec -- npm ci",
          "shell": "bash"
        },
        {
          "run": "mise exec -- sh ./nanvm/demos/gen.build.sh",
          "shell": "bash"
        },
        {
          "run": "mise exec -- npm run rustdoc-bars",
          "shell": "bash",
          "env": {
            "WORKERS_CI_COMMIT_SHA": "${{ github.sha }}",
            "WORKERS_CI_BRANCH": "${{ github.head_ref || github.ref_name }}"
          }
        },
        {
          "run": "mise exec -- cargo doc --no-deps --workspace",
          "shell": "bash",
          "env": {
            "RUSTDOCFLAGS": "--html-in-header ${{ github.workspace }}/_rustdoc-head.html --html-before-content ${{ github.workspace }}/_rustdoc-header.html --html-after-content ${{ github.workspace }}/_rustdoc-footer.html --extend-css ${{ github.workspace }}/_rustdoc.css"
          }
        },
        {
          "run": "mise exec -- npm run website",
          "shell": "bash",
          "env": {
            "WORKERS_CI_COMMIT_SHA": "${{ github.sha }}",
            "WORKERS_CI_BRANCH": "${{ github.head_ref || github.ref_name }}"
          }
        },
        {
          "if": "github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository",
          "run": "mise exec -- node ./fjs/website/github-deploy.mjs preview",
          "shell": "bash",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "WORKERS_CI_BRANCH": "${{ github.head_ref }}",
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
          "run": "mise exec -- node ./fjs/website/github-deploy.mjs production",
          "shell": "bash",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          }
        }
      ]
    }
  }
}
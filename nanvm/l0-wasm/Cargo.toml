[package]
name = "nanvm-l0-wasm"
version = "0.1.0"
edition = "2024"

# `cdylib` is the `.wasm` that exports `fjs:l0`. Its code is all for
# `wasm32`: natively the crate is empty.
[lib]
crate-type = ["cdylib"]
# Nothing here runs natively, and a test binary has no host for its import:
# the proofs are the emitter's host proofs, run on the built `.wasm`.
test = false
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
nanvm-lib = { path = "../lib" }
